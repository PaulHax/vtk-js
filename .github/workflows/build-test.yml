name: Build and Test
on:
  pull_request:
  merge_group:

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        node: [22]
        browser: [chromium, firefox]
    name: ${{ matrix.os }} / node ${{ matrix.node }} / ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup project
        uses: ./.github/actions/setup-node-project
        with:
          node-version: '${{ matrix.node }}'
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browser
        if: matrix.browser == 'chromium' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install ${{ matrix.browser }}
      - name: Install Playwright system deps
        if: matrix.browser == 'chromium'
        run: sudo npx playwright install-deps ${{ matrix.browser }}
      - name: Install Firefox + geckodriver (webdriverio path)
        if: matrix.browser == 'firefox'
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -q https://packages.mozilla.org/apt/repo-signing-key.gpg -O- | sudo tee /etc/apt/keyrings/packages.mozilla.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main" | sudo tee /etc/apt/sources.list.d/mozilla.list
          echo "Package: *
          Pin: origin packages.mozilla.org
          Pin-Priority: 1000" | sudo tee /etc/apt/preferences.d/mozilla
          sudo apt-get update
          sudo apt-get install -y firefox
          GECKODRIVER_VERSION=0.36.0
          wget -q https://github.com/mozilla/geckodriver/releases/download/v${GECKODRIVER_VERSION}/geckodriver-v${GECKODRIVER_VERSION}-linux64.tar.gz
          tar -xzf geckodriver-v${GECKODRIVER_VERSION}-linux64.tar.gz
          sudo mv geckodriver /usr/local/bin/
          geckodriver --version
          firefox --version
      - name: Build
        run: npm run build:release
      - name: Archive build output
        if: github.event_name != 'merge_group' && matrix.browser == 'chromium'
        uses: actions/upload-artifact@v7
        with:
          name: build-results-${{ matrix.os }}-node_${{ matrix.node }}
          path: dist
          retention-days: 15
      - name: Validate generated typescript definitions
        run: |
          npx tsc -p tsconfig.esm-check.json
          npx tsc -p tsconfig.umd-check.json
      - name: Tests
        env:
          TEST_BROWSER: ${{ matrix.browser }}
        run: xvfb-run --auto-servernum npm test
      - name: Archive test results
        if: github.event_name != 'merge_group' && (success() || failure())
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: test-results-${{ matrix.os }}-node_${{ matrix.node }}-${{ matrix.browser }}
          path: Utilities/TestResults/
          retention-days: 15
